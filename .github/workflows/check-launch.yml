name: Check public launch readiness

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Preview checks current hosting; launch checks intended public domains without changing them
        type: choice
        options: [preview, launch]
        default: launch

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect DNS, HTTPS, redirects and Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: node scripts/check-launch.mjs --profile "$PROFILE" --output "$RUNNER_TEMP/launch-readiness.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/launch-readiness.json
          if-no-files-found: warn
          retention-days: 14
