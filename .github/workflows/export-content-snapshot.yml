name: Export Public Content Snapshot

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full reviewed commit SHA containing the public-safe normalizers
        type: string
        required: true
      inspect_event_forms:
        description: Log public form field names and types for upcoming events, never guest responses
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-content-snapshot
  cancel-in-progress: false

jobs:
  export:
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
      WIX_HEADLESS_ENABLED: ${{ vars.WIX_HEADLESS_ENABLED }}
      WIX_HEADLESS_CLIENT_ID: ${{ vars.WIX_HEADLESS_CLIENT_ID }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate source revision
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "A full lowercase commit SHA is required."
            exit 1
          fi
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require tested public-safe normalizers
        run: node --test scripts/wix-content.test.mjs
      - name: Sync normalized public Wix content
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
        run: npm run sync:wix
      - name: Inspect public visitor form schemas
        if: inputs.inspect_event_forms
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          import { createClient, ApiKeyStrategy } from "@wix/sdk";
          import { wixEventsV2 } from "@wix/events";
          async function inspect() {
            const snapshot = JSON.parse(await readFile("src/data/wix-content.json", "utf8"));
            const client = createClient({ modules: { wixEventsV2 }, auth: ApiKeyStrategy({
              apiKey: process.env.WIX_API_KEY, siteId: process.env.WIX_SITE_ID,
            }) });
            for (const selected of snapshot.events.filter(event => event.status === "UPCOMING" && Date.parse(event.endAt || event.startAt) >= Date.now())) {
              const response = await client.wixEventsV2.getEvent(selected.id, { fields: ["REGISTRATION", "FORM"] });
              const event = response.event || response;
              if (event._id !== selected.id) throw new Error("Unexpected event identity");
              console.log(JSON.stringify({
                eventId: selected.id, slug: selected.slug,
                responseShape: response.event ? "wrapped" : "direct",
                registrationType: event.registration?.type,
                initialType: event.registration?.initialType,
                registrationStatus: event.registration?.status,
                controls: (event.form?.controls || []).filter(control => !control.deleted).map(control => ({
                  type: control.type,
                  inputs: (control.inputs || []).map(input => ({
                    name: input.name, type: input.type, mandatory: input.mandatory, array: input.array,
                  })),
                })),
              }));
            }
          }
          inspect().catch(() => { console.error("Public event form schema inspection failed; no raw SDK details logged."); process.exitCode = 1; });
          NODE
      - name: Sync public calendar
        run: npm run sync:calendar
      - name: Sync public newsletter archive
        env:
          CONSTANT_CONTACT_ARCHIVE_ID: ${{ vars.CONSTANT_CONTACT_ARCHIVE_ID }}
        run: npm run sync:newsletters
      - name: Validate public export format
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          import { assertPublicSnapshot } from "./scripts/normalize-wix-content.mjs";
          assertPublicSnapshot(JSON.parse(await readFile("src/data/wix-content.json", "utf8")));
          NODE
      - name: Upload only normalized public snapshots
        uses: actions/upload-artifact@v4
        with:
          name: public-content-${{ github.run_id }}
          path: |
            src/data/wix-content.json
            src/data/calendar-events.json
            src/data/newsletters.json
          if-no-files-found: error
          retention-days: 7
      - name: Build and check the exported content
        run: npm run build && npm test
