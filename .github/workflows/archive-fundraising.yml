name: Archive fundraising deployments

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fundraising-archive
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.repository == 'montlake-pta/website' &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install capture browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Recover and publish fundraising archive
        run: node scripts/publish-fundraising-archive.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
