name: Set Up Wix CMS

on:
  workflow_dispatch:
    inputs:
      page:
        description: Optional single static page slug to seed without touching other collections
        type: string

permissions:
  contents: read

concurrency:
  group: wix-cms-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create and seed CMS collections
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
          PAGE_SLUG: ${{ inputs.page }}
        run: |
          if [[ -n "$PAGE_SLUG" ]]; then
            npm run setup:wix-cms -- --page "$PAGE_SLUG"
          else
            npm run setup:wix-cms
          fi
