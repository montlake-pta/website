name: Verify Wix Publish Notifications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-publishing-probe
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise temporary non-public CMS records
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
        run: node scripts/check-wix-publishing.mjs
