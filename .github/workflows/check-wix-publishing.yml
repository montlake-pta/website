name: Verify Wix Publish Notifications

on:
  workflow_dispatch:
    inputs:
      include_store:
        description: Also exercise a temporary hidden product and its collection membership
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wix-publishing-probe
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exercise temporary non-public CMS records
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
          INCLUDE_STORE: ${{ inputs.include_store }}
        run: |
          if [[ "$INCLUDE_STORE" == "true" ]]; then
            node scripts/check-wix-publishing.mjs --include-store
          else
            node scripts/check-wix-publishing.mjs
          fi
