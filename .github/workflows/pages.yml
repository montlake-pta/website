name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - wix-content-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
      WIX_HEADLESS_ENABLED: ${{ vars.WIX_HEADLESS_ENABLED }}
      WIX_HEADLESS_CLIENT_ID: ${{ vars.WIX_HEADLESS_CLIENT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Allow Wix changes to become visible to read APIs
        if: github.event_name == 'workflow_dispatch' && github.actor == 'montlake-pta-publish-bridge[bot]'
        run: sleep 15
      - name: Sync content from Wix
        if: vars.WIX_SYNC_ENABLED == 'true'
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
        run: npm run sync:wix
      - name: Sync public school calendar
        run: npm run sync:calendar
      - name: Sync public newsletter archive
        if: vars.CONSTANT_CONTACT_ARCHIVE_ID != ''
        env:
          CONSTANT_CONTACT_ARCHIVE_ID: ${{ vars.CONSTANT_CONTACT_ARCHIVE_ID }}
        run: npm run sync:newsletters
      - name: Report newsletter snapshot mode
        if: vars.CONSTANT_CONTACT_ARCHIVE_ID == ''
        run: echo "::notice::Constant Contact archive is not configured; building the checked-in newsletter snapshot."
      - name: Report snapshot mode
        if: vars.WIX_SYNC_ENABLED != 'true'
        run: echo "::notice::Wix sync is not enabled; building the checked-in content snapshot."
      - name: Build site
        run: npm run build
      - name: Check generated site
        run: npm test
      - name: Require cutover readiness when activating the new domain or transactions
        run: npm run check:cutover -- --if-enabled
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
